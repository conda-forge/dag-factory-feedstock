{% set name = "dag-factory" %}
{% set version = "1.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/dag_factory-{{ version }}.tar.gz
  sha256: da2e547c8eedeb7e156940e849faec5d8419ab661e48494e148b75dd2c95567a

build:
  entry_points:
    - dagfactory = dagfactory.__main__:app
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - apache-airflow >=2.4
    - pyyaml
    - packaging
    - typer

test:
  imports:
    - dagfactory
  commands:
    - pip check
    - dagfactory --help
  requires:
    - pip

about:
  home: https://astronomer.github.io/dag-factory/latest/
  summary: Dynamically build Apache Airflow DAGs from YAML files
  dev_url: https://github.com/astronomer/dag-factory
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - claytonparnell
